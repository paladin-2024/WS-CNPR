name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    name: PHP lint + composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_pgsql, gd, zip, mbstring, curl, intl, bcmath
          coverage: none

      - name: composer validate
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Lint every PHP file (php -l)
        run: |
          set -e
          find . -path ./vendor -prune -o -name "*.php" -print0 \
            | xargs -0 -n1 -P"$(nproc)" php -l

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cnpr-app:ci

      - name: docker compose config validation
        run: |
          # docker-compose.yml references env_file: .env, which is gitignored
          # and never present in CI - .env.example has the same variable
          # names with non-secret placeholder values, enough to validate
          # compose file structure without needing real credentials.
          cp .env.example .env
          docker compose config -q
