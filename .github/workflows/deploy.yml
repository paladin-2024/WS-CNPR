name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ secrets.VPS_PROJECT_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build

            # nginx doesn't hot-reload its config file when it changes on
            # disk, and "up -d --build" only recreates containers whose own
            # image/config changed - nginx's doesn't, on a normal app-only
            # deploy. Two problems that fixes: (1) any nginx/conf.d change
            # in this same deploy would otherwise sit unused until nginx
            # happened to restart for some other reason; (2) nginx caches
            # the "app" hostname's resolved IP for the life of its worker
            # process, so leaving it running across an app-container
            # recreation (a new IP) means fastcgi_pass silently points at a
            # dead address - reproduced live once already as a 502.
            docker compose restart nginx
            docker image prune -f

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://cnpr.wscsarl.info/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "Health check passed ($code)"
              exit 0
            fi
            echo "Attempt $i: got $code, retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after deploy"
          exit 1
