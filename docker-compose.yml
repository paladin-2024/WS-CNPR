# Portail Numérique du Ministère des Transports — Docker Compose stack for cnpr.wscsarl.info
#
# Services: nginx (plain HTTP, LOCAL ONLY) -> app (php-fpm) -> db (postgres)
#
# This VPS also hosts other sites (wscsarl.info, dgpspt.wscsarl.info) behind
# a system-level Nginx that already owns host ports 80/443. So this stack's
# own nginx does NOT bind to 80/443 - it listens on 127.0.0.1:8081 only, and
# the SYSTEM Nginx reverse-proxies cnpr.wscsarl.info to it (same pattern
# already used for dgpspt.wscsarl.info -> 127.0.0.1:8000, see
# /etc/nginx/conf.d/taxe-kisangani.conf on the VPS). TLS terminates at the
# system Nginx via the box's existing certbot setup - there is no built-in
# certbot service in this stack, it would just fight the system one over the
# same domain.
#
# ────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP (fresh install)
# ────────────────────────────────────────────────────────────────────────────
#   1. cp .env.production .env
#      Fill in real values — at minimum DB_PASSWORD, and the SMS_* vars if
#      SMS sending is needed. Leave DB_HOST=postgres and DB_PORT=5432 as-is;
#      those are the Postgres service's name and *internal* container port on
#      the compose network, not a host-facing address.
#
#   2. docker compose up -d --build
#      - postgres starts, runs schema.sql from /docker-entrypoint-initdb.d/
#      - nginx listens on 127.0.0.1:8081 only (not exposed outside the VPS)
#      - app runs docker-entrypoint.sh: waits for DB, runs seed.php
#
#   3. Add a system-Nginx server block proxying cnpr.wscsarl.info to
#      127.0.0.1:8081, then `certbot --nginx -d cnpr.wscsarl.info` for TLS -
#      see DEPLOYMENT.md.
#
# Re-running `docker compose up -d` afterwards (e.g. after a `git pull` +
# rebuild) does NOT need manual seed — entrypoint handles it idempotently.
# ────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: cnpr_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-min_transport}
      POSTGRES_USER: ${DB_USERNAME:-transport_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-transport_app} -d ${DB_DATABASE:-min_transport}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cnpr_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnpr_php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./public:/var/www/html/public:ro
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./index.php:/var/www/html/index.php:ro
      - ./router.php:/var/www/html/router.php:ro
      - uploads_conducteurs:/var/www/html/public/uploads/conducteurs
      - uploads_signatures:/var/www/html/public/uploads/signatures
      - uploads_logos:/var/www/html/public/uploads/logos
      - uploads_signalements:/var/www/html/public/uploads/signalements
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cnpr_network

  nginx:
    image: nginx:1.27-alpine
    container_name: cnpr_nginx
    restart: unless-stopped
    ports:
      # Local only - the system Nginx on this VPS owns 80/443 for the other
      # sites it hosts and reverse-proxies cnpr.wscsarl.info here.
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./public:/var/www/html/public:ro
      - uploads_conducteurs:/var/www/html/public/uploads/conducteurs:ro
      - uploads_signatures:/var/www/html/public/uploads/signatures:ro
      - uploads_logos:/var/www/html/public/uploads/logos:ro
      - uploads_signalements:/var/www/html/public/uploads/signalements:ro
    depends_on:
      - app
    networks:
      - cnpr_network

volumes:
  postgres_data:
  uploads_conducteurs:
  uploads_signatures:
  uploads_logos:
  uploads_signalements:
  storage_logs:

networks:
  cnpr_network:
    driver: bridge