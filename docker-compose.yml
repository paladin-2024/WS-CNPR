# Portail Numérique du Ministère des Transports — Docker Compose stack.
#
# Services: nginx (edge/static) -> app (php-fpm) -> db (postgres).
#
# ────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP (fresh install)
# ────────────────────────────────────────────────────────────────────────────
#   1. cp .env.docker.example .env
#      Fill in real values — at minimum DB_PASSWORD, and the SMS_* vars if
#      SMS sending is needed. Leave DB_HOST=db and DB_PORT=5432 as-is; those
#      are the Postgres service's name and *internal* container port on the
#      compose network, not a host-facing address.
#
#   2. docker compose up -d --build
#
#   3. docker compose exec app php database/seed.php
#      The `db` service's POSTGRES_DB only creates an empty database — the
#      app's own tables (utilisateurs, conducteurs, vehicules, ...) and the
#      default admin/agent accounts still need database/schema.sql applied,
#      which this script does (idempotent — safe to re-run any time, e.g.
#      after pulling schema changes). Prints the default login credentials
#      when it finishes.
#
#   4. Visit http://localhost/ (or the host/port you've mapped below).
#
# Re-running `docker compose up -d` afterwards (e.g. after a `git pull` +
# rebuild) does NOT need step 3 repeated unless schema.sql itself changed —
# it's cheap to re-run anyway since it's idempotent.
# ────────────────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - uploads_data:/var/www/html/public/uploads
      - logs_data:/var/www/html/storage/logs
    expose:
      - "9000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Uncomment to terminate TLS here once real certificates exist on the
      # host (see the commented HTTPS block at the bottom of
      # deploy/nginx.conf.example — do not enable either half without the
      # other):
      # - "443:443"
    volumes:
      - ./deploy/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - uploads_data:/var/www/html/public/uploads:ro
      # Mount real certs here if you enable the "443" port above, e.g.:
      # - /etc/letsencrypt/live/your-domain/:/etc/nginx/certs:ro
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not exposed to the host by default (app/nginx reach it over the compose
    # network by service name "db"). Uncomment for host-side psql access
    # during setup/debugging — pick a host port that won't clash with a
    # host-installed Postgres if one exists:
    # ports:
    #   - "5433:5432"

volumes:
  uploads_data:
  logs_data:
  postgres_data:
