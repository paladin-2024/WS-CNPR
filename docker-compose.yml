# Portail Numérique du Ministère des Transports — Docker Compose stack for cnpr.wscsarl.info
#
# Services: nginx (edge/SSL) -> app (php-fpm) -> db (postgres) + certbot (auto-renew)
#
# ────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP (fresh install)
# ────────────────────────────────────────────────────────────────────────────
#   1. cp .env.production .env
#      Fill in real values — at minimum DB_PASSWORD, and the SMS_* vars if
#      SMS sending is needed. Leave DB_HOST=postgres and DB_PORT=5432 as-is;
#      those are the Postgres service's name and *internal* container port on
#      the compose network, not a host-facing address.
#
#   2. docker compose up -d --build
#      - postgres starts, runs schema.sql from /docker-entrypoint-initdb.d/
#      - certbot auto-obtains Let's Encrypt cert for cnpr.wscsarl.info (port 80)
#      - app runs docker-entrypoint.sh: waits for DB, runs seed.php
#
#   3. Visit https://cnpr.wscsarl.info
#
# Re-running `docker compose up -d` afterwards (e.g. after a `git pull` +
# rebuild) does NOT need manual seed — entrypoint handles it idempotently.
# ────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: cnpr_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-min_transport}
      POSTGRES_USER: ${DB_USERNAME:-transport_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-transport_app} -d ${DB_DATABASE:-min_transport}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cnpr_network

  app:
    image: ghcr.io/${GHCR_OWNER:-paladin-2024}/cnpr-app:latest
    container_name: cnpr_php
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./public:/var/www/html/public:ro
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./index.php:/var/www/html/index.php:ro
      - ./router.php:/var/www/html/router.php:ro
      - uploads_conducteurs:/var/www/html/public/uploads/conducteurs
      - uploads_signatures:/var/www/html/public/uploads/signatures
      - uploads_logos:/var/www/html/public/uploads/logos
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cnpr_network

  nginx:
    image: nginx:1.27-alpine
    container_name: cnpr_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./public:/var/www/html/public:ro
      - uploads_conducteurs:/var/www/html/public/uploads/conducteurs:ro
      - uploads_signatures:/var/www/html/public/uploads/signatures:ro
      - uploads_logos:/var/www/html/public/uploads/logos:ro
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    depends_on:
      - app
    networks:
      - cnpr_network

  certbot:
    image: certbot/certbot:latest
    container_name: cnpr_certbot
    restart: unless-stopped
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet || true; sleep 12h & wait $${!}; done'"
    networks:
      - cnpr_network

volumes:
  postgres_data:
  uploads_conducteurs:
  uploads_signatures:
  uploads_logos:
  storage_logs:
  certbot_www:
  certbot_etc:

networks:
  cnpr_network:
    driver: bridge