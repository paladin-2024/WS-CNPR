# Plain HTTP only - this container is reached via 127.0.0.1:8081 from the
# VPS's system Nginx, which terminates TLS for cnpr.wscsarl.info and forwards
# here (see docker-compose.yml's nginx service and DEPLOYMENT.md). It is not
# reachable from outside the VPS directly.
server {
    listen 80;
    listen [::]:80;
    server_name cnpr.wscsarl.info;

    # index.php lives at the project root (not under public/) - this must be
    # the project root so /public/assets/... and /public/uploads/... resolve
    # against the real files mounted into this container, and so PHP's
    # SCRIPT_FILENAME (built from $document_root) matches where index.php
    # actually sits inside the app (php-fpm) container's filesystem.
    root /var/www/html;
    index index.php;

    # Don't advertise the nginx version in the Server header or on default
    # error pages (server_tokens defaults to "on" in the stock nginx:alpine
    # image used here, and there's no shared nginx.conf we control to flip
    # it at http{} scope instead).
    server_tokens off;

    # Trust the scheme/IP the system Nginx already established (it sets
    # X-Forwarded-Proto/X-Real-IP itself - see /etc/nginx/conf.d/
    # taxe-kisangani.conf on the VPS for the matching proxy_pass config).
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;

    client_max_body_size 10M;

    # Basic response hardening (matches deploy/nginx.conf.example, which had
    # these but this container's actual production config didn't).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Static assets - long cache (filenames don't rotate).
    location ^~ /public/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Uploaded files - served directly, shorter/no aggressive caching since
    # content can be replaced (e.g. a re-uploaded photo).
    location ^~ /public/uploads/ {
        location ~ \.php$ { deny all; }
        try_files $uri =404;
    }

    # Deny access to sensitive paths - index.php is the project root here,
    # so nothing else stops these from being served as static files.
    location ~ /\.(env|git|htaccess|htpasswd) { deny all; }
    location ~ ^/(database|storage|config|app|vendor)/ { deny all; }
    location ~ /(composer\.json|composer\.lock)$ { deny all; }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Everything else: serve an existing FILE as-is, otherwise route to the
    # front controller with the path captured as $_GET['url'] (mirrors
    # .htaccess/router.php). Deliberately does NOT include a `$uri/`
    # directory-exists candidate like a typical try_files pattern would (see
    # deploy/nginx.conf.example, written for a bare-metal deploy where this
    # container's nginx doesn't apply) - this container's nginx only has
    # public/ bind-mounted (docker-compose.yml), not index.php itself, so
    # `$uri/` matching the bare project-root directory (which DOES exist,
    # even though index.php inside it doesn't from nginx's point of view)
    # would trigger nginx's own `index` directive lookup for index.php,
    # fail to find it, and 403 - reproduced live in production. This app has
    # no legitimate directory-listing use case anyway; every non-static-file
    # request should go through index.php.
    location / {
        try_files $uri /index.php?url=$uri&$args;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Stock fastcgi_params does NOT forward arbitrary incoming headers -
        # index.php's HTTPS/secure-cookie detection reads
        # HTTP_X_FORWARDED_PROTO, which the system Nginx in front of this
        # container sets (proxy_set_header X-Forwarded-Proto $scheme;).
        # Without this, PHP would never see it and session cookies would
        # never get the "secure" flag even over real HTTPS.
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }

    location ~ \.php$ {
        deny all;
    }
}
